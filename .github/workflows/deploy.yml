# Deploys the app to Cloudflare (docs/database.md, "Deploying"), as `npm run deploy` does on a computer: builds the web
# app, applies the migrations the remote database doesn't have yet, and uploads the Worker with the app's files. Only
# started by hand (Actions → Deploy → Run workflow), from the branch picked there. Needs, in the repository's settings
# (apps/worker/README.md, "Deploying from GitHub"):
# - the secret CLOUDFLARE_API_TOKEN: a Cloudflare API token that may edit Workers and D1;
# - the secret CLOUDFLARE_ACCOUNT_ID: the Cloudflare account's id;
# - the secret CLOUDFLARE_D1_ID: the D1 database's id (CLOUDFLARE_D1_ID in apps/worker/cloudflare.env);
# - the variable CLOUDFLARE_JURISDICTION: eu, fedramp or none (CLOUDFLARE_JURISDICTION in apps/worker/cloudflare.env).
#   A variable, not a secret: it isn't sensitive, and masking "eu" would hide it inside every other word of the logs.
# Each id is a secret of its own, so that GitHub masks it wherever the logs print it. The keys of the model configs are
# Worker secrets, set in Cloudflare and left alone by a deployment.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a second waits for the first.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Deploying doesn't run Electron: its binary isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write cloudflare.env
        env:
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
          CLOUDFLARE_JURISDICTION: ${{ vars.CLOUDFLARE_JURISDICTION }}
        run: |
          if [ -z "$CLOUDFLARE_D1_ID" ] || [ -z "$CLOUDFLARE_JURISDICTION" ]; then
            echo "The secret CLOUDFLARE_D1_ID or the variable CLOUDFLARE_JURISDICTION is missing (apps/worker/README.md, \"Deploying from GitHub\")."
            exit 1
          fi
          printf 'CLOUDFLARE_JURISDICTION=%s\nCLOUDFLARE_D1_ID=%s\n' "$CLOUDFLARE_JURISDICTION" "$CLOUDFLARE_D1_ID" > apps/worker/cloudflare.env
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
