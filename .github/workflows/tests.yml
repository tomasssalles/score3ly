# Tests and typechecks on every push to main (docs/overview.md §12): the working branches aren't checked here, only what
# lands on main. Deploying is a workflow of its own, started by hand (deploy.yml).
name: Typecheck and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The tests don't run Electron: its binary isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck every workspace
        run: npm run typecheck --workspaces --if-present
      - name: Test
        run: npm test
      # The replay tests (docs/overview.md §12) drive the real app in Chromium, the version this Playwright expects.
      - name: Install Chromium for the replay tests
        run: npx playwright install --with-deps chromium
      - name: Replay tests
        run: npm run replay
